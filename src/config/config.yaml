# User overrides, mounted at /config/config.yaml. Only list what you change;
# every key and its default is documented in censor_proxy/defaults.yaml.

censor:
  style: gaussian          # gaussian | pixelate | solid

logging:
  level: debug             # off | info (hostnames) | debug (full URLs); debug while testing

proxy:
  # Hosts that bypass TLS interception (regexes on host:port), e.g. for
  # certificate-pinned clients.
  passthrough_hosts:
    # Chromium background services that don't honour the CACertificates
    # policy. No page images come from them.
    - '^update\.googleapis\.com:'
    - '^optimizationguide-pa\.googleapis\.com:'

video:
  # Temporarily on while debugging video pages; logs page URLs.
  debug: true

whitelist:
  # Passed through unscanned, with their subdomains. Managed from the admin
  # panel's Whitelist tab.
  domains:
    - youtube.com
