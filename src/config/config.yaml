# User overrides, mounted at /config/config.yaml. Only list what you change;
# every key and its default is documented in censor_proxy/defaults.yaml.

censor:
  style: gaussian          # gaussian | pixelate | solid

logging:
  level: debug             # off | info (hostnames) | debug (full URLs); debug while testing

video:
  # Temporarily on while debugging video pages; logs page URLs.
  debug: true

whitelist:
  # Not intercepted at all, with their subdomains; added to the built-in
  # list (browser and OS updates, sign-in, password managers, payments,
  # banks, health sites, streaming and YouTube, .gov/.mil/.edu, gov.uk,
  # edu.au). Managed from the admin panel's Whitelist tab.
  domains: []
detection:
  male_context_exempts: false
model:
  workers: 4
  threads_per_worker: 8
