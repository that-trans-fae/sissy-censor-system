# Default configuration. A user config file (CENSOR_CONFIG, default
# /config/config.yaml) is deep-merged over this, so it only needs the keys
# it changes. Unknown keys are rejected so typos fail loudly at startup.

model:
  # ONNX weights. null uses the 320n model bundled with the nudenet package
  # (~0.1 s/image on CPU). The Docker image also bakes in the more accurate
  # 640m (~0.6 s/image): set path /app/models/640m.onnx and resolution 640.
  path: null
  # Must match the model: 640 for 640m, 320 for 320n.
  resolution: 320
  # Concurrent inference workers, and onnxruntime threads per worker.
  workers: 2
  threads_per_worker: 4
  # Also scan tall or wide images as overlapping square tiles. Catches small
  # regions lost when the whole frame is shrunk to the model's input, at
  # roughly 2-4x the inference time on those images.
  tiling: true

detection:
  # Minimum score for a box to be censored. Set low on purpose: false
  # positives are preferred to misses.
  threshold: 0.3
  # Per-label overrides of `threshold`. Breasts sit higher: at 0.3 they
  # over-triggered.
  label_thresholds:
    FEMALE_BREAST_EXPOSED: 0.4
  # Context adjusts the threshold for female labels:
  # - a box near (see `proximity`) another female-label box that is above its
  #   own threshold needs only corroborated_threshold, e.g. the second breast
  #   of a pair;
  # - a box with no other female context anywhere in the image, while male
  #   context is present, needs male_context_threshold, e.g. a male chest
  #   misread as female. Set it equal to `threshold` to disable.
  corroborated_threshold: 0.3
  male_context_threshold: 0.625
  # Always censored when above threshold.
  female_labels:
    - FEMALE_BREAST_EXPOSED
    - FEMALE_GENITALIA_EXPOSED
  # Not sex-specific. Censored unless attributable to a male subject only.
  unsexed_labels:
    - BUTTOCKS_EXPOSED
    - ANUS_EXPOSED
  # Detections used to attribute an unsexed box to a sex. They are never
  # censored themselves unless they also appear in female_labels.
  female_context_labels:
    - FACE_FEMALE
    - FEMALE_BREAST_EXPOSED
    - FEMALE_GENITALIA_EXPOSED
    - FEMALE_BREAST_COVERED
    - FEMALE_GENITALIA_COVERED
  male_context_labels:
    - FACE_MALE
    - MALE_GENITALIA_EXPOSED
    - MALE_BREAST_EXPOSED
  # Minimum score for a context detection to count.
  context_threshold: 0.35
  # Female context that overlaps an unsexed box counts from this lower score
  # and overrides male_context_exempts (e.g. weak female genitalia inside a
  # buttocks box that also sits near a male detection).
  overlap_context_threshold: 0.25
  # Boxes are "near" when the gap between them is at most this fraction of
  # the unsexed box's longer side. 0 means they must overlap.
  proximity: 0.5
  # When an unsexed box is near male context and no female context, pass it.
  # false censors every unsexed box regardless.
  male_context_exempts: true

censor:
  # gaussian | pixelate | solid
  style: gaussian
  # Each box grows by this fraction of its size on every side.
  padding: 0.10
  # gaussian: kernel size as a fraction of the box's longer side.
  blur_strength: 0.5
  # pixelate: number of blocks across the box's longer side.
  pixel_blocks: 10
  # solid: fill colour as [R, G, B].
  fill_color: [0, 0, 0]
  # If detection errors or exceeds timeout_seconds, censor the whole image
  # (true) or deliver it unmodified (false).
  fail_closed: true
  timeout_seconds: 20
  # Re-encode quality for lossy formats (JPEG, lossy WebP).
  quality: 90

images:
  # Images smaller than this many bytes, or with a shorter side under
  # min_side_px, pass through unscanned.
  size_floor_bytes: 4096
  min_side_px: 64
  # Larger images, or ones that would take more than max_decoded_bytes of
  # memory to decode (width x height x 4 x frames), aren't scanned: they are
  # delivered as their first frame, fully censored. Nothing streams through
  # unscanned.
  max_bytes: 268435456
  max_decoded_bytes: 2147483648
  # Animated images: run detection on every Nth frame; skipped frames get the
  # union of the boxes from the sampled frames either side. Long animations
  # use a larger step so no more than max_detect_frames are scanned.
  frame_step: 2
  max_detect_frames: 48
  # Animations with more frames than this get the same first-frame treatment.
  max_frames: 600

data_uris:
  # Scan text bodies for base64 data-URI images (data:image/...;base64,...)
  # and censor them in place, with the same rules as image responses.
  enabled: true
  # Matched against the response Content-Type, ignoring parameters.
  content_types:
    - text/html
    - text/css
    - application/json
  # Larger text bodies are streamed through unscanned.
  max_body_bytes: 10485760

video:
  # Inject a control on pages from `hosts` that covers every <video> and
  # offers a censored copy, produced by the proxy with ffmpeg.
  enabled: true
  # Regexes matched against the page's hostname. Every site by default.
  # Injecting means extending each page's Content-Security-Policy to allow
  # our script, so narrow this to limit that.
  hosts:
    - '.*'
  # Model for video frames. null uses the bundled 320n; 640m is far too slow
  # for video (~10 s of work per second of video).
  model_path: null
  model_resolution: 320
  tiling: false
  # Frames per second that go through detection; boxes are held across the
  # frames in between.
  sample_fps: 4
  # Output is scaled down to at most this height and frame rate.
  max_height: 720
  max_fps: 30
  # Extra padding on video boxes (fraction of box size) to cover motion
  # between samples. Used instead of censor.padding.
  padding: 0.25
  # Keep the original audio (re-encoded to AAC). false outputs silent video.
  audio: true
  # x264 settings for the censored copy.
  preset: veryfast
  crf: 23
  # Seconds of censored video to have ready before playback starts.
  ready_seconds: 3
  # Longer videos are refused (they stay covered).
  max_duration_seconds: 1800
  max_concurrent_jobs: 1
  # Allow sources on loopback or private networks. Off so pages can't use
  # the proxy to reach the local network; turn on for a LAN media server.
  allow_private_sources: false
  # Censored outputs, reused when the same video is played again. Oldest
  # are deleted beyond cache_max_bytes.
  cache_dir: /tmp/censor-video
  cache_max_bytes: 2147483648
  # Name shown on the injected control; its look is set in static/inject.js.
  brand_name: Censor

proxy:
  # Regexes matched against host:port. Matching hosts bypass TLS
  # interception entirely (mitmproxy ignore_hosts).
  passthrough_hosts: []
  # Hostname the proxy answers on itself (/health, /inject.js, /video/...).
  # Requests to it are routed to an internal server on internal_port.
  health_host: censor.local
  internal_port: 8081

cache:
  # Content-hash cache of scan results. 0 disables it.
  max_entries: 1024

logging:
  # off | info | debug. info logs hostnames; debug adds full URLs.
  level: info
  # JSONL detection log. Rotated at max_bytes, keeping `backups` old files.
  path: /logs/detections.jsonl
  max_bytes: 10485760
  backups: 5
