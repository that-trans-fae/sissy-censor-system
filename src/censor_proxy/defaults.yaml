# Default configuration. A user config file (CENSOR_CONFIG, default
# /config/config.yaml) is deep-merged over this, so it only needs the keys
# it changes. Unknown keys are rejected so typos fail loudly at startup.

model:
  # ONNX weights. null uses the 320n model bundled with the nudenet package
  # (~0.1 s/image on CPU). The Docker image also bakes in the more accurate
  # 640m (~0.6 s/image): set path /app/models/640m.onnx and resolution 640.
  path: null
  # Must match the model: 640 for 640m, 320 for 320n.
  resolution: 320
  # Concurrent inference workers, and onnxruntime threads per worker.
  workers: 2
  threads_per_worker: 4
  # Also scan tall or wide images as overlapping square tiles. Catches small
  # regions lost when the whole frame is shrunk to the model's input, at
  # roughly 2-4x the inference time on those images.
  tiling: true
  # Models the admin panel offers for model.* and video.model_*: a name, the
  # label on the panel's image model switch, the weights (null: the 320n
  # bundled with nudenet) and the resolution they need. The Docker image
  # bakes in both of these.
  available:
    - name: 320n
      label: Fast
      description: About 0.25 s per image. Misses more.
      path: null
      resolution: 320
    - name: 640m
      label: Slow
      description: More accurate, about 2 s per image with tiling.
      path: /app/models/640m.onnx
      resolution: 640

detection:
  # Censoring level: a name from `presets`, or custom. A preset sets every
  # other detection key to the defaults below plus the preset's own
  # settings; detection keys in config.yaml are kept but ignored. custom
  # uses the detection keys from config.yaml. Picked at the top of the admin
  # panel's Settings tab.
  preset: strict
  # Each preset's description and the detection keys it changes. Add as
  # many as you like under detection.presets in config.yaml: they merge with
  # these by name (the same name replaces one, null removes it), and each
  # shows up as a choice in the admin panel.
  presets:
    strict:
      description: Exposed breasts, genitalia, buttocks and anus are censored.
      settings: {}
    lax:
      description: Like strict, but exposed breasts pass. They still count as
        female context, so buttocks next to them stay censored.
      settings:
        female_labels:
          - FEMALE_GENITALIA_EXPOSED
  # Minimum score for a box to be censored. Set low on purpose: false
  # positives are preferred to misses.
  threshold: 0.3
  # Per-label overrides of `threshold`. Breasts sit higher: at 0.3 they
  # over-triggered.
  label_thresholds:
    FEMALE_BREAST_EXPOSED: 0.4
  # Context adjusts the threshold for female labels:
  # - a box near (see `proximity`) another female-label box that is above its
  #   own threshold needs only corroborated_threshold, e.g. the second breast
  #   of a pair;
  # - a box with no other female context anywhere in the image, while male
  #   context is present, needs male_context_threshold, e.g. a male chest
  #   misread as female. Set it equal to `threshold` to disable.
  corroborated_threshold: 0.3
  male_context_threshold: 0.625
  # Always censored when above threshold.
  female_labels:
    - FEMALE_BREAST_EXPOSED
    - FEMALE_GENITALIA_EXPOSED
  # Not sex-specific. Censored unless attributable to a male subject only.
  unsexed_labels:
    - BUTTOCKS_EXPOSED
    - ANUS_EXPOSED
  # Detections used to attribute an unsexed box to a sex. They are never
  # censored themselves unless they also appear in female_labels.
  female_context_labels:
    - FACE_FEMALE
    - FEMALE_BREAST_EXPOSED
    - FEMALE_GENITALIA_EXPOSED
    - FEMALE_BREAST_COVERED
    - FEMALE_GENITALIA_COVERED
  male_context_labels:
    - FACE_MALE
    - MALE_GENITALIA_EXPOSED
    - MALE_BREAST_EXPOSED
  # Minimum score for a context detection to count.
  context_threshold: 0.35
  # Female context that overlaps an unsexed box counts from this lower score
  # and overrides male_context_exempts (e.g. weak female genitalia inside a
  # buttocks box that also sits near a male detection).
  overlap_context_threshold: 0.25
  # Boxes are "near" when the gap between them is at most this fraction of
  # the unsexed box's longer side. 0 means they must overlap.
  proximity: 0.5
  # When an unsexed box is near male context and no female context, pass it.
  # false censors every unsexed box regardless.
  male_context_exempts: true
  # The model scores every label for every box. For a female label listed
  # here, its male counterpart's score on the same box is shown in review
  # output and the debug log, and is used by male_score_ratio.
  male_counterparts:
    FEMALE_BREAST_EXPOSED: MALE_BREAST_EXPOSED
    FEMALE_GENITALIA_EXPOSED: MALE_GENITALIA_EXPOSED
  # Pass a female box when its male counterpart scores at least this
  # fraction of its own score (0.5: male at least half the female score).
  # 0 turns it off. Off by default: on the samples the male score of a
  # misread male chest was 0.000, the same as on real female breasts.
  male_score_ratio: 0
  # Penises take priority: a box of a label in yields_to_male is not
  # censored when it and a male_priority_labels box scoring at least
  # male_priority_threshold overlap by male_priority_overlap or more of the
  # smaller box, so the blur never lands on the penis (and a penis read as
  # a breast isn't blurred). Other boxes in the image are unaffected. Edge
  # contact between a breast and a penis (under 0.25 in browsing logs) stays
  # censored; the threshold keeps weak penis detections (0.26-0.28 in two
  # censor/ samples) from uncovering real breasts. An empty list disables it.
  yields_to_male:
    - FEMALE_BREAST_EXPOSED
  male_priority_labels:
    - MALE_GENITALIA_EXPOSED
  male_priority_threshold: 0.35
  male_priority_overlap: 0.5

censor:
  # gaussian | pixelate | solid
  style: gaussian
  # Each box grows by this fraction of its size on every side.
  padding: 0.10
  # gaussian: kernel size as a fraction of the box's longer side.
  blur_strength: 0.5
  # pixelate: number of blocks across the box's longer side.
  pixel_blocks: 10
  # solid: fill colour as [R, G, B].
  fill_color: [0, 0, 0]
  # If detection errors or exceeds timeout_seconds, censor the whole image
  # (true) or deliver it unmodified (false).
  fail_closed: true
  timeout_seconds: 20
  # Re-encode quality for lossy formats (JPEG, lossy WebP, AVIF).
  quality: 90
  # AVIF encoder speed, 0 (slowest, smallest) to 10 (fastest). 8 re-encodes
  # a 720p image in ~60 ms.
  avif_speed: 8

images:
  # Images smaller than this many bytes, or with a shorter side under
  # min_side_px, pass through unscanned.
  size_floor_bytes: 1024
  min_side_px: 64
  # Formats removed from the Accept header of image requests, so servers
  # that negotiate formats (image CDNs) send one the censor can decode.
  # Chromium asks for JPEG XL, which Pillow can't read.
  strip_accept:
    - image/jxl
    - image/heic
    - image/heif
    - image/jp2
  # Responses whose Content-Type doesn't say image are checked for a
  # supported image signature (JPEG, PNG, GIF, WebP, AVIF) and censored like
  # any other image; browsers display such images regardless of the label.
  # - sniff_image_requests: anything the browser requested as an image
  #   (Sec-Fetch-Dest: image, i.e. <img> and CSS images), whatever its type.
  # - sniff_types: these Content-Types on any request ('' is a missing
  #   header). Only buffered when Content-Length is at most sniff_max_bytes,
  #   so large downloads and media segments still stream.
  sniff_image_requests: true
  sniff_types:
    - ''
    - application/octet-stream
    - binary/octet-stream
    - application/binary
  sniff_max_bytes: 16777216
  # Larger images, or ones that would take more than max_decoded_bytes of
  # memory to decode (width x height x 4 x frames), aren't scanned: they are
  # delivered as their first frame, fully censored. Nothing streams through
  # unscanned.
  max_bytes: 268435456
  max_decoded_bytes: 2147483648
  # Animated images: run detection on every Nth frame; skipped frames get the
  # union of the boxes from the sampled frames either side. Long animations
  # use a larger step so no more than max_detect_frames are scanned.
  frame_step: 2
  max_detect_frames: 48
  # Animations with more frames than this get the same first-frame treatment.
  max_frames: 600
  # Pages get a placeholder card over images still loading
  # placeholder_delay_ms after they come into view (usually waiting their
  # turn in the censor), removed when the image arrives or fails. Images
  # with a side under placeholder_min_px on the page get none. Drawn by the
  # injected script, so only on pages matching video.hosts; a slow network
  # shows it too, since the page can't tell the two apart.
  placeholders: true
  placeholder_delay_ms: 400
  placeholder_min_px: 48
  # An image the page gives no size takes no room until it loads. Unless it
  # sits alone in a sized box (whose box the card then covers), it is held
  # open at this many pixels on each unsized axis (capped at its container's
  # width) while it waits, and let go when it loads. 0 leaves such images
  # without a placeholder.
  placeholder_reserve_px: 160

data_uris:
  # Scan text bodies for base64 data-URI images (data:image/...;base64,...)
  # and censor them in place, with the same rules as image responses.
  enabled: true
  # Matched against the response Content-Type, ignoring parameters; globs
  # allowed. JavaScript is where ad tags usually carry their creatives.
  # Censoring an image changes the body, so a <script> or stylesheet pinned
  # with Subresource Integrity stops loading if one of its images is
  # censored.
  content_types:
    - text/html
    - application/xhtml+xml
    - text/css
    - application/json
    - application/*+json
    - text/javascript
    - application/javascript
    - application/x-javascript
    - text/xml
    - application/xml
    - application/*+xml
    - image/svg+xml
    - text/plain
  # Larger text bodies are streamed through unscanned.
  max_body_bytes: 10485760
  # Base64 SVG data URIs are decoded and scanned for data-URI images inside
  # them, up to this many SVGs deep. 0 leaves SVG data URIs alone.
  svg_depth: 2

video:
  # Inject a control on pages from `hosts` that covers every <video> and
  # offers a censored copy, produced by the proxy with ffmpeg.
  enabled: true
  # Regexes matched against the page's hostname. Every site by default.
  # Injecting means extending each page's Content-Security-Policy to allow
  # our script, so narrow this to limit that.
  hosts:
    - '.*'
  # Model for video frames. null uses the bundled 320n; 640m is far too slow
  # for video (~10 s of work per second of video).
  model_path: null
  model_resolution: 320
  tiling: false
  # Frames per second that go through detection; boxes are held across the
  # frames in between.
  sample_fps: 4
  # Output is scaled down to at most this height and frame rate.
  max_height: 720
  max_fps: 30
  # Extra padding on video boxes (fraction of box size) to cover motion
  # between samples. Used instead of censor.padding.
  padding: 0.25
  # Keep the original audio (re-encoded to AAC). false outputs silent video.
  audio: true
  # x264 settings for the censored copy.
  preset: veryfast
  crf: 23
  # Seconds of censored video to have ready before playback starts.
  ready_seconds: 3
  # Longer videos are refused (they stay covered).
  max_duration_seconds: 1800
  # Jobs beyond this wait in a queue ("Waiting for another video").
  max_concurrent_jobs: 1
  # A job nobody is streaming or polling for this long (the tab crashed or
  # lost its connection) is cancelled, so it doesn't hold a slot. Closing or
  # leaving the page cancels at once. Playing it again starts over. Pages
  # check in every 2 s, so keep this above that.
  abandon_seconds: 5
  # A running job whose video has been paused or in a background tab this
  # long gives its slot to a queued video someone is waiting on. With
  # nothing queued it keeps working ahead.
  idle_seconds: 5
  # Allow sources on loopback or private networks. Off so pages can't use
  # the proxy to reach the local network; turn on for a LAN media server.
  allow_private_sources: false
  # Censored outputs, reused when the same video is played again. Oldest
  # are deleted beyond cache_max_bytes.
  cache_dir: /tmp/censor-video
  cache_max_bytes: 2147483648
  # Name shown on the injected control; its look is set in static/inject.js.
  brand_name: Sissy Censor System
  # The injected script reports what it sees (videos found, their size,
  # source URLs, errors) to the proxy log. Includes page URLs.
  debug: false

proxy:
  # Regexes matched against host:port. Matching hosts bypass TLS
  # interception entirely (mitmproxy ignore_hosts), so nothing they serve is
  # censored. Only list hosts that break under interception, carry
  # credentials or money, or otherwise don't serve explicit content: not
  # google.com or gstatic.com (Image Search thumbnails), CDNs, social or chat
  # sites. Add your own hosts with extra_passthrough_hosts rather than
  # overriding this list, which replaces it.
  passthrough_hosts:
    # Chromium background services that ignore the CACertificates policy,
    # and the binary downloads update.googleapis.com redirects to.
    - '^update\.googleapis\.com:'
    - '^optimizationguide-pa\.googleapis\.com:'
    - '(^|\.)gvt1\.com:'
    - '^dl\.google\.com:'
    # Sign-in providers.
    - '^accounts\.google\.com:'
    - '^login\.(microsoftonline|live)\.com:'
    - '^(appleid|idmsa)\.apple\.com:'
    # Password managers.
    - '(^|\.)1password\.(com|ca|eu):'
    - '(^|\.)bitwarden\.(com|eu):'
    - '(^|\.)lastpass\.com:'
    # Payment processors (card fields are iframes from these hosts).
    # PayPal's images come from paypalobjects.com, which stays censored.
    - '(^|\.)stripe\.(com|network):'
    - '(^|\.)braintreegateway\.com:'
    - '(^|\.)paypal\.com:'
    # Common US banks and card issuers.
    - '(^|\.)(chase|bankofamerica|wellsfargo|citi|citibank|usbank|capitalone|pnc|truist|tdbank|ally|discover|americanexpress|usaa|regions|citizensbank|53|key|huntington|mtb|sofi|chime|marcus|synchrony)\.com:'
    - '(^|\.)navyfederal\.org:'
    # Brokerages and retirement accounts.
    - '(^|\.)(schwab|fidelity|vanguard|etrade|robinhood|merrilledge|empower)\.com:'
    # US government, military and education sites.
    - '\.(gov|mil|edu):'
    # Identity verification used by government sign-ins.
    - '(^|\.)id\.me:'
  # Appended to passthrough_hosts: your bank, health portal, employer or
  # university sign-in, without repeating the defaults.
  extra_passthrough_hosts: []
  # Hostname the proxy answers on itself (/health, /inject.js, /video/...).
  # Requests to it are routed to an internal server on internal_port.
  health_host: censor.local
  # Hostname the admin panel answers on through the proxy
  # (https://scs.local/admin). Requests to it go to the admin listener.
  admin_host: scs.local
  internal_port: 8081

whitelist:
  # Domains whose content passes through unscanned and unmodified: no image
  # or data-URI censoring and no video control. An entry covers the domain
  # and its subdomains (youtube.com also covers www.youtube.com; a leading
  # www. is dropped). Edited from the admin panel's Whitelist tab.
  domains: []
  # Also pass requests made by a whitelisted page (matched by Referer or
  # Origin), so images a site loads from its own CDN pass too: youtube.com
  # loads thumbnails from i.ytimg.com. That includes any third-party images
  # or ads the page embeds. false: only the request's own host counts.
  match_referer: true

admin:
  # Admin panel: status, detection log, video jobs, whitelist and settings.
  # Served at https://<proxy.admin_host>/admin through the proxy, and at
  # http://localhost:<port>/admin directly. Changing enabled, bind or port
  # needs a restart.
  enabled: true
  # The listener inside the container. 0.0.0.0 so Docker can publish the
  # port; compose maps it to the host's loopback only.
  bind: 0.0.0.0
  port: 8082
  # Host names accepted by the listener besides proxy.admin_host (any port).
  # Other names are refused, so a DNS-rebinding page can't reach the panel.
  allowed_hosts:
    - localhost
    - 127.0.0.1
    - '[::1]'
  # PIN lock, set from the panel and stored hashed. null: no lock. To reset
  # a forgotten PIN, delete this key from config.yaml and restart.
  pin_hash: null
  # Wrong PIN entries are never locked out. They are recorded here (time and
  # the address the panel was opened on) and listed in the panel after the
  # next unlock until dismissed. A file, so a restart doesn't clear them;
  # null keeps them in memory only.
  attempts_log: /logs/admin-attempts.jsonl
  # An unlocked panel locks again after this long without use (the panel's
  # own auto-refresh doesn't count as use).
  session_seconds: 900
  # Most recent detection log entries the panel loads.
  log_entries: 500

cache:
  # Content-hash cache of scan results. 0 disables it.
  max_entries: 1024

logging:
  # off | info | debug. info logs hostnames; debug adds full URLs, every
  # image scanned, and every response requested as an image that wasn't
  # scanned (action "unscanned", with the reason).
  level: info
  # JSONL detection log. Rotated at max_bytes, keeping `backups` old files.
  path: /logs/detections.jsonl
  max_bytes: 10485760
  backups: 5
